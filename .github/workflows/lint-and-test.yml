name: Lint and Test

on:
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.0'
  # Must match `version` in .custom-gcl.yml
  GOLANGCI_LINT_VERSION: 'v2.14.0'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-go caches ~/go/pkg/mod and ~/.cache/go-build keyed by go.sum
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Create frontend dist directory
        run: |
          mkdir -p frontend/dist
          echo "/* Empty file for CI build */" > frontend/dist/dummy.txt

      - name: Cache custom linter binary
        id: custom-linter-cache
        uses: actions/cache@v4
        with:
          path: .bin/dv-golangci-lint
          key: ${{ runner.os }}-custom-gcl-${{ env.GO_VERSION }}-${{ hashFiles('.custom-gcl.yml', 'pkg/linters/**') }}

      - name: Build custom linter
        if: steps.custom-linter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" ${{ env.GOLANGCI_LINT_VERSION }}
          mkdir -p .bin
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
          "$RUNNER_TEMP/bin/golangci-lint" custom -v

      - name: Cache golangci-lint analysis
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('go.sum', '.golangci.yml', '.custom-gcl.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-golangci-${{ hashFiles('go.sum', '.golangci.yml', '.custom-gcl.yml') }}-

      - name: Run linters
        run: ./.bin/dv-golangci-lint run --timeout=5m --show-stats --config .golangci.yml

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Create frontend dist directory
        run: |
          mkdir -p frontend/dist
          echo "/* Empty file for CI build */" > frontend/dist/dummy.txt

      - name: Run tests
        run: make test

  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for version info

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Create frontend dist directory
        run: |
          mkdir -p frontend/dist
          echo "/* Empty file for CI build */" > frontend/dist/dummy.txt

      - name: Generate version info
        run: |
          echo "Project version: $(make version)"
          echo "Version number: $(make version-number)"

      - name: Build application
        run: |
          echo "Building application..."
          make build

          # Verify binary was created
          if [ -f ".bin/dv-merchant" ]; then
            echo "✅ Binary built successfully"
            ls -la .bin/
          else
            echo "❌ Binary not found"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dv-merchant-binary
          path: .bin/dv-merchant
          retention-days: 7
